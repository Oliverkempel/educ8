# Every push to main: test, then build all downloads and publish them as a GitHub release.
# Versions are date-based (UTC): 2026.11.19, then 2026.11.19.1, .2, … for later releases that day. See docs/notes/decisions.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release. Off = build everything only (to test a branch before merging).
        type: boolean
        default: true

# One release at a time, never cancelled: two pushes in quick succession get consecutive versions.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet build Educ8.slnx -c Release
      - run: dotnet test Educ8.slnx -c Release --no-build --logger trx --results-directory test-results
      - name: Keep test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: |
          version=$(.github/scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

  # educ8-mcp for every platform, cross-published from Linux: one self-contained file per platform.
  mcp:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-arm64, osx-x64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Publish
        run: >
          dotnet publish src/Educ8.Mcp.Server -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=$VERSION -o out
      - name: Pack
        run: |
          name="educ8-mcp-$VERSION-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ matrix.rid }}" = win-x64 ]; then
            (cd out && zip -q "../dist/$name.zip" educ8-mcp.exe)
          else
            tar -czf "dist/$name.tar.gz" -C out educ8-mcp
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.rid }}
          path: dist/*

  # The Linux desktop app (with its educ8-mcp) as a tar.gz with an installer.
  desktop:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Publish app and MCP server
        run: |
          name="educ8-$VERSION-${{ matrix.rid }}"
          for project in Educ8.App.Gtk Educ8.Mcp.Server; do
            dotnet publish "src/$project" -c Release -r ${{ matrix.rid }} --self-contained -p:DebugType=none -p:Version=$VERSION -o "$name/app"
          done
          cp packaging/linux/* "$name/"
          echo "$VERSION" > "$name/VERSION"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: dist/*

  # The same app as a Flatpak bundle on the GNOME runtime (packages the desktop job's publish; see the manifest).
  # Runs on the runner itself, not in Flathub's builder container: that image has no package manager, so Docker/QEMU
  # (needed for aarch64) can't be added there. The runner has Docker, and flatpak-builder comes from apt.
  flatpak:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rid: linux-x64
          - arch: aarch64
            rid: linux-arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: dl
      - name: Stage the publish for the manifest
        run: |
          tar -xzf "dl/educ8-$VERSION-${{ matrix.rid }}.tar.gz"
          mkdir -p packaging/flatpak/stage
          cp -R "educ8-$VERSION-${{ matrix.rid }}/." packaging/flatpak/stage/
      - name: QEMU (aarch64)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Flatpak tooling and GNOME runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder
          # Ubuntu restricts unprivileged user namespaces, which bubblewrap (used by flatpak-builder) needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive --arch="$ARCH" flathub org.gnome.Platform//51 org.gnome.Sdk//51
      - name: Build the Flatpak bundle
        working-directory: packaging/flatpak
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --arch="$ARCH" --repo=repo build io.github.educ8.Educ8.yml
          mkdir -p "$GITHUB_WORKSPACE/dist"
          flatpak build-bundle --arch="$ARCH" repo "$GITHUB_WORKSPACE/dist/educ8-$VERSION-$ARCH.flatpak" io.github.educ8.Educ8
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*

  # The same app as a strict snap (amd64 natively, arm64 cross-packed). Ubuntu 24.04 matches the snap's core24 base,
  # so snapcraft packs directly on the runner (--destructive-mode) without LXD.
  snap:
    needs: [version, desktop]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
          - arch: arm64
            rid: linux-arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: dl
      - name: Stage the publish for snapcraft
        run: |
          tar -xzf "dl/educ8-$VERSION-${{ matrix.rid }}.tar.gz"
          mkdir -p packaging/snap/stage
          cp -R "educ8-$VERSION-${{ matrix.rid }}/." packaging/snap/stage/
          sed -i "s/^version: .*/version: '$VERSION'/" packaging/snap/snapcraft.yaml
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Pack the snap
        working-directory: packaging/snap
        run: |
          # snapcraft only writes inside the project folder, so pack into out/ and move it to dist/.
          sudo snapcraft pack --destructive-mode --build-for="$ARCH" --output "out/educ8_${VERSION}_${ARCH}.snap"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          sudo mv "out/educ8_${VERSION}_${ARCH}.snap" "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: dist/*

  release:
    # Manual runs with "publish" off stop here: everything is built (and kept as run artifacts) but not released.
    if: github.event_name == 'push' || inputs.publish
    needs: [version, mcp, desktop, flatpak, snap]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Create the release (and its tag)
        run: >
          gh release create "v$VERSION" dist/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Educ8 $VERSION" --generate-notes
