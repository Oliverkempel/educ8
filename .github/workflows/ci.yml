# Build and test pull requests (on open and on every new commit to them). Plain pushes to branches don't run anything;
# when a pull request lands in main, release.yml tests again and releases.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet build Educ8.slnx -c Release
      - run: dotnet test Educ8.slnx -c Release --no-build --logger trx --results-directory test-results
      - name: Keep test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
