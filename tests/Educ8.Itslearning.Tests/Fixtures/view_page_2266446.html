    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initializeShowMoreLess();
            let childHasUnsavedChanges = false;
            window.addEventListener('message', (event) => {
                const { data } = event;
                if (!data || data.feedbackWasModified !== 'true') return;
                childHasUnsavedChanges = !!data.dirty;
            });

            window.addEventListener('beforeunload', (event) => {
                if (!childHasUnsavedChanges) return;
                event.preventDefault();
                event.returnValue = '';
            });
        });

        function initializeShowMoreLess() {
            const containers = document.querySelectorAll('.description-container');

            containers.forEach(function (container) {
                const textElement = container.querySelector('.description-text');
                const toggleButton = container.querySelector('.show-more-toggle');

                if (!textElement || !toggleButton) return;

                if (shouldShowToggle(textElement)) {
                    textElement.classList.add('collapsed');
                    toggleButton.style.display = 'flex';

                    toggleButton.addEventListener('click', function () {
                        toggleDescription(textElement, toggleButton);
                    });
                }
            });
        }

        function shouldShowToggle(element) {
            const clone = element.cloneNode(true);
            clone.style.position = 'absolute';
            clone.style.visibility = 'hidden';
            clone.style.height = 'auto';
            clone.style.maxHeight = 'none';
            clone.classList.remove('collapsed');
            clone.style.webkitLineClamp = 'unset';
            clone.style.display = 'block';

            element.parentNode.appendChild(clone);

            const fullHeight = clone.offsetHeight;
            const lineHeight = parseFloat(getComputedStyle(clone).lineHeight);
            const linesCount = Math.ceil(fullHeight / lineHeight);

            element.parentNode.removeChild(clone);

            return linesCount > 2;
        }

        function toggleDescription(textElement, toggleButton) {
            const toggleText = toggleButton.querySelector('.toggle-text');
            const arrow = toggleButton.querySelector('.arrow');
            const isCollapsed = textElement.classList.contains('collapsed');

            if (isCollapsed) {
                textElement.classList.remove('collapsed');
                toggleText.textContent = 'Show less';
                arrow.classList.remove('down');
                arrow.classList.add('up');
            } else {
                textElement.classList.add('collapsed');
                toggleText.textContent = 'Show more';
                arrow.classList.remove('up');
                arrow.classList.add('down');
            }
        }

        function pageLoad() {
            initializeShowMoreLess();
        }
    </script>
